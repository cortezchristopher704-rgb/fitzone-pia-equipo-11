name: FitZone PIA — CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  quality-and-tests:
    name: Linter, Unit & Integration Tests & Coverage >= 80%
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código fuente
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependencias del proyecto
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Análisis estático de código con Ruff (Linter)
        run: ruff check src tests

      - name: Validar sintaxis del frontend JavaScript
        run: node --check frontend/app.js

      - name: Ejecutar Suite de Pruebas y Validar Cobertura >= 80%
        env:
          DATABASE_URL: "sqlite:///./fitzone_ci.sqlite3"
          FITZONE_DATA_DIR: ./datos
        run: |
          pytest -v --cov=src --cov-report=term-missing --cov-fail-under=80 tests

      - name: Validar configuración Docker Compose
        run: docker compose config

      - name: Construir imágenes y levantar PostgreSQL, API y worker
        run: |
          docker compose build
          docker compose up -d db app worker

      - name: Verificar API y arranque del worker en contenedores
        run: |
          for intento in $(seq 1 30); do
            if curl --fail --silent http://localhost:8000/health; then
              echo "API disponible"
              break
            fi
            if [ "$intento" -eq 30 ]; then
              echo "La API no respondió dentro del tiempo esperado"
              docker compose logs app db worker
              exit 1
            fi
            sleep 2
          done
          docker compose logs worker
          docker compose logs worker | grep -q "Worker FitZone iniciado"
          docker compose ps

      - name: Ejecutar pruebas dentro del contenedor de tests
        run: docker compose run --rm tests

      - name: Detener y limpiar contenedores
        if: always()
        run: docker compose down -v
