version: "3.9"

services:
  db:
    image: postgres:15-alpine
    container_name: fitzone_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fitzone_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fitzone_pass}
      POSTGRES_DB: ${POSTGRES_DB:-fitzone_db}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-fitzone_user} -d $${POSTGRES_DB:-fitzone_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: fitzone_api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-fitzone_user}:${POSTGRES_PASSWORD:-fitzone_pass}@db:5432/${POSTGRES_DB:-fitzone_db}
      FITZONE_DATA_DIR: /app/datos
      FITZONE_STAFF_TOKEN_RECEPCION: ${FITZONE_STAFF_TOKEN_RECEPCION:-}
      FITZONE_STAFF_TOKEN_INSTRUCTOR: ${FITZONE_STAFF_TOKEN_INSTRUCTOR:-}
      FITZONE_STAFF_TOKEN_ADMIN: ${FITZONE_STAFF_TOKEN_ADMIN:-}
    ports:
      - "${PORT:-8000}:8000"
    command: ["uvicorn", "src.api.main:app", "--host", "0.0.0.0", "--port", "8000"]

  tests:
    build: .
    container_name: fitzone_tests
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: testing
      DATABASE_URL: "sqlite:///./fitzone_compose_tests.sqlite3"
      FITZONE_DATA_DIR: /app/datos
    command: ["pytest", "-v", "--cov=src", "--cov-report=term-missing", "--cov-fail-under=80", "tests"]

  worker:
    build: .
    container_name: fitzone_worker
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-fitzone_user}:${POSTGRES_PASSWORD:-fitzone_pass}@db:5432/${POSTGRES_DB:-fitzone_db}
      FITZONE_WORKER_INTERVAL_SECONDS: ${FITZONE_WORKER_INTERVAL_SECONDS:-60}
      FITZONE_ALERTA_HORA: ${FITZONE_ALERTA_HORA:-08:00}
      FITZONE_ALERTA_DIAS: ${FITZONE_ALERTA_DIAS:-7}
    command: ["python", "-m", "src.jobs.worker"]
